name: Render 3D Ident

on:
  workflow_dispatch:
    inputs:
      text:
        description: "Text to display"
        required: true
        default: "MATHEWW"
        type: string

      front_color:
        description: "Front face color"
        required: true
        default: "#F2F4F7"
        type: string

      bevel_color:
        description: "Blue bevel accent"
        required: true
        default: "#1480FF"
        type: string

      side_color:
        description: "Dark blue extrusion color"
        required: true
        default: "#053494"
        type: string

      duration:
        description: "Duration in seconds"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  render:
    name: Render Deterministic 3D Ident
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies (clean reproducible)
        run: npm ci

      - name: Install Playwright Chromium & system dependencies
        run: npx playwright install --with-deps chromium

      - name: Install and verify FFmpeg & FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Render deterministic 3D frames
        env:
          IDENT_TEXT: ${{ inputs.text }}
          IDENT_FRONT_COLOR: ${{ inputs.front_color }}
          IDENT_BEVEL_COLOR: ${{ inputs.bevel_color }}
          IDENT_SIDE_COLOR: ${{ inputs.side_color }}
          IDENT_DURATION: ${{ inputs.duration }}
        run: node render/render-frames.mjs

      - name: Encode H.264 MP4
        run: node render/encode.mjs

      - name: Validate final video
        run: node render/validate.mjs

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.text }}-Gothic-3D-Ident-MP4
          path: output/*.mp4
          retention-days: 14
          if-no-files-found: error
